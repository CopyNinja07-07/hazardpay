<style>
html,body{margin:0;height:100%;background:#05070b;overflow:hidden;color:#eef2f8;font-family:Inter,system-ui,sans-serif}
#gl{position:fixed;inset:0}
.ov{position:fixed;pointer-events:none;transition:opacity .8s,transform .8s}
#title{inset:0;background:radial-gradient(ellipse at center,rgba(5,7,11,.88) 0%,rgba(5,7,11,.6) 60%,rgba(5,7,11,.2) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;text-align:center}
#title h1{font:700 92px/1.02 "Space Grotesk";letter-spacing:-2px;margin:0}
#title h1 em{font-style:italic;font-weight:400;color:#ff8a3d}
#title p{font:400 30px Inter;color:#b9c4d6;margin:0;max-width:1300px}
#title p u{text-decoration-color:#ff8a3d;text-underline-offset:6px}
#cap{left:50%;bottom:56px;transform:translateX(-50%);max-width:1400px;text-align:center;font:500 34px/1.35 Inter;opacity:0;padding:14px 26px;border-radius:14px;background:rgba(5,7,11,.72)}
#cap b{color:#ff8a3d;font-weight:700}#cap i{color:#9fd9ff}
#chap{left:56px;top:48px;font:700 18px "JetBrains Mono";letter-spacing:3px;color:#ff8a3d;opacity:0}
#score{right:56px;top:48px;opacity:0;background:rgba(10,14,22,.85);border:1px solid #233046;border-radius:18px;padding:20px 26px;min-width:360px}
#score .row{display:flex;justify-content:space-between;font:500 24px Inter;color:#b9c4d6;margin:4px 0}
#score .row b{font:700 30px "JetBrains Mono";color:#eef2f8}
#score .big{font:700 74px "Space Grotesk";letter-spacing:-1px;margin-top:8px}
#score .big.red{color:#ff5c77}#score .big.price{color:#ffc439}
#gates{left:50%;top:70px;transform:translateX(-50%);display:flex;gap:18px;opacity:0}
.gate{display:flex;align-items:center;gap:12px;background:rgba(10,14,22,.85);border:1px solid #233046;border-radius:14px;padding:12px 18px;font:600 22px Inter}
.gate i{width:20px;height:20px;border-radius:50%;background:#3a4256;display:inline-block;transition:background .4s,box-shadow .4s}
.gate.on i{background:#3ddc91;box-shadow:0 0 18px #3ddc91}
#stamp{left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg) scale(2);opacity:0;font:800 120px "Space Grotesk";padding:6px 36px;border:10px solid;border-radius:20px;transition:all .35s cubic-bezier(.2,1.6,.4,1)}
#price{left:50%;top:44%;transform:translate(-50%,-50%);opacity:0;text-align:center;background:rgba(5,7,11,.82);border:1px solid #233046;border-radius:22px;padding:22px 40px}
#price .a{font:700 120px "Space Grotesk";color:#ffc439;letter-spacing:-2px}
#price .s{font:400 30px Inter;color:#b9c4d6}
#name{left:110px;bottom:150px;opacity:0}
#name h2{font:700 140px/0.9 "Space Grotesk";margin:0;letter-spacing:-4px}
#name h2 em{font-style:italic;font-weight:400;color:#ff8a3d}
#name p{font:400 28px/1.5 Inter;color:#b9c4d6;margin:12px 0 0;max-width:820px}
#ai{left:80px;top:150px;width:720px;opacity:0;font:600 26px/1.5 "JetBrains Mono";color:#ff8a6a;background:rgba(30,8,10,.75);border:1px solid #5a2030;border-radius:16px;padding:20px 24px}
#ai .h{font:700 18px "JetBrains Mono";letter-spacing:3px;color:#ff5c77;margin-bottom:8px}
#cflabels{inset:0;opacity:0}
.cfl{position:absolute;font:700 22px Inter;padding:6px 12px;border-radius:10px;background:rgba(10,14,22,.85);border:1px solid #233046;white-space:nowrap}
.cfl.ok{border-color:#3ddc91;color:#3ddc91}.cfl.bad{border-color:#ff5c77;color:#ff5c77}
#fade{inset:0;background:#05070b;opacity:1;transition:opacity 1.2s}
