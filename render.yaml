# One-click deploy of the live demo on Render: https://render.com/deploy?repo=https://github.com/CopyNinja07-07/hazardpay
services:
  - type: web
    name: hazardpay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HAZARDPAY_HOSTED      # serve the pre-run physics in prerun/, reset after 20 idle minutes
        value: "1"
      - key: HAZARDPAY_WORKERS     # the free plan has a fraction of one CPU
        value: "1"
      - key: POLICY_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID      # PayPal sandbox app (US business account, for Payouts)
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY        # optional: photo/description -> route
        sync: false
